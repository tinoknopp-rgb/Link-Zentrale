name: App bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
env:
  KS: ${{ secrets.KEYSTORE_B64 }}
  KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
  KEY_ALIAS: tino
  UT: ${{ secrets.UPDATE_TOKEN }}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Signatur-Schlüssel aus Secret
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/tino.jks"; echo "KEYSTORE_FILE=$RUNNER_TEMP/tino.jks" >> $GITHUB_ENV; fi
      - name: Secrets prüfen
        run: |
          echo "KEYSTORE_B64: ${#KS} Zeichen"; echo "KEYSTORE_PASS: ${#KEYSTORE_PASS} Zeichen"; echo "UPDATE_TOKEN: ${#UT} Zeichen"
      - name: Versionsnummer
        run: echo "VC=$((GITHUB_RUN_NUMBER + 1))" >> $GITHUB_ENV
      - name: APK bauen
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace && cp app/build/outputs/apk/debug/app-debug.apk Link-Zentrale.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Link-Zentrale-APK
          path: Link-Zentrale.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: EXE bauen
        shell: bash
        run: |
          VC=$((GITHUB_RUN_NUMBER + 1))
          dotnet publish windows/LinkZentrale.csproj -c Release -p:Version=1.$VC -o out
          cp out/Link-Zentrale.exe Link-Zentrale.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Link-Zentrale-EXE
          path: Link-Zentrale.exe

  publish:
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Versionsnummer
        run: echo "VC=$((GITHUB_RUN_NUMBER + 1))" >> $GITHUB_ENV
      - name: Als Update veröffentlichen (öffentliches Update-Repo)
        if: env.KS != '' && env.UT != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: tinoknopp-rgb/HandyPutz-Updates
          token: ${{ secrets.UPDATE_TOKEN }}
          tag_name: link-v1.${{ env.VC }}
          name: Link-Zentrale 1.${{ env.VC }}
          body: |
            Neue Version der Link-Zentrale
            📱 Android: Link-Zentrale.apk
            💻 Windows: Link-Zentrale.exe
          files: |
            Link-Zentrale.apk
            Link-Zentrale.exe
          make_latest: false
      - name: Fester Test-Link (immer neueste Version)
        if: env.KS != '' && env.UT != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: tinoknopp-rgb/HandyPutz-Updates
          token: ${{ secrets.UPDATE_TOKEN }}
          tag_name: link-zentrale
          name: Link-Zentrale (immer aktuell)
          body: |
            Fester Link zur jeweils neuesten Link-Zentrale (zum Weitergeben an Testpersonen)
            📱 Android: https://github.com/tinoknopp-rgb/HandyPutz-Updates/releases/download/link-zentrale/Link-Zentrale.apk
            💻 Windows: https://github.com/tinoknopp-rgb/HandyPutz-Updates/releases/download/link-zentrale/Link-Zentrale.exe
          files: |
            Link-Zentrale.apk
            Link-Zentrale.exe
          overwrite_files: true
          make_latest: false
