name: App bauen
on:
  push:
    paths-ignore: ['**.md', 'chats/**', 'dateien/**']
  workflow_dispatch:
permissions:
  contents: write
env:
  KS: ${{ secrets.KEYSTORE_B64 }}
  KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
  KEY_ALIAS: tino
  UT: ${{ secrets.UPDATE_TOKEN }}
  # Woher die App ihre Updates holt: Besitzer dieses Repos + /Link-Zentrale-Updates (kein Konto fest im Code)
  APP_REPO: ${{ github.repository_owner }}/Link-Zentrale-Updates
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Signatur-Schlüssel aus Secret
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/tino.jks"; echo "KEYSTORE_FILE=$RUNNER_TEMP/tino.jks" >> $GITHUB_ENV; fi
      - name: Versionsnummer
        run: echo "VC=$((GITHUB_RUN_NUMBER + 1))" >> $GITHUB_ENV
      - name: Tests + APK (Release, verkleinert)
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace && cp app/build/outputs/apk/release/app-release.apk Link-Zentrale.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Link-Zentrale-APK
          path: Link-Zentrale.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Tests
        run: dotnet test windows.Tests/LinkZentrale.Tests.csproj
      - name: EXE bauen
        shell: bash
        run: |
          VC=$((GITHUB_RUN_NUMBER + 1))
          sed -i "s|APP_REPO = \"\"|APP_REPO = \"$APP_REPO\"|" windows/Secrets.cs
          dotnet publish windows/LinkZentrale.csproj -c Release -p:Version=1.$VC -o out
          cp out/Link-Zentrale.exe Link-Zentrale.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Link-Zentrale-EXE
          path: Link-Zentrale.exe

  publish:
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Versionsnummer
        run: echo "VC=$((GITHUB_RUN_NUMBER + 1))" >> $GITHUB_ENV
      - name: Neue Version im eigenen Update-Repo
        if: env.KS != '' && env.UT != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.UPDATE_TOKEN }}
          tag_name: v1.${{ env.VC }}
          name: Link-Zentrale 1.${{ env.VC }}
          body: |
            📱 Android: Link-Zentrale.apk
            💻 Windows: Link-Zentrale.exe
            Fester Link (immer neueste Version): …/releases/latest/download/Link-Zentrale.apk bzw. .exe
          files: |
            Link-Zentrale.apk
            Link-Zentrale.exe
          make_latest: true
      # ---- Übergang: ältere Link-Zentralen (bis 1.20) suchen Updates noch im HandyPutz-Repo ----
      - name: Übergang – alte Versionen versorgen
        if: env.KS != '' && env.UT != '' && github.repository_owner == 'tinoknopp-rgb'
        uses: softprops/action-gh-release@v2
        with:
          repository: tinoknopp-rgb/HandyPutz-Updates
          token: ${{ secrets.UPDATE_TOKEN }}
          tag_name: link-v1.${{ env.VC }}
          name: Link-Zentrale 1.${{ env.VC }}
          body: Übergangs-Version – neue Updates kommen aus Link-Zentrale-Updates
          files: |
            Link-Zentrale.apk
            Link-Zentrale.exe
          make_latest: false
